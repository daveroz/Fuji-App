name: Build APK
# Builds the Fuji Remote APK on every push and on demand. Each run uploads the APK as an
# artifact (FujiRemote.apk). Runs on the default branch that are signed with the fixed key also
# publish it to the "app-latest" release for a stable download link.
on:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Optional fixed signing key (repository secret FUJI_KEYSTORE_BASE64). Without it the APK is
      # signed with a throwaway debug key — fine for sideloading, but it won't upgrade a prior one.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.FUJI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/fuji.keystore"
            echo "FUJI_KEYSTORE_FILE=$RUNNER_TEMP/fuji.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_WITH_FIXED_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::FUJI_KEYSTORE_BASE64 secret not set; APK signed with a throwaway key."
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest

      - name: Assemble release APK
        env:
          FUJI_KEYSTORE_PASSWORD: ${{ secrets.FUJI_KEYSTORE_PASSWORD }}
          FUJI_KEY_ALIAS: ${{ secrets.FUJI_KEY_ALIAS }}
          FUJI_KEY_PASSWORD: ${{ secrets.FUJI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FujiRemote.apk

      - uses: actions/upload-artifact@v7
        with:
          path: FujiRemote.apk
          archive: false # download the APK itself, not a zip

      - name: Publish to the app-latest release
        if: env.SIGNED_WITH_FIXED_KEY == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          title="Fuji Remote $version"
          notes="Built from ${GITHUB_SHA::7}. Install with: adb install -r FujiRemote.apk"
          if gh release view app-latest > /dev/null 2>&1; then
            gh release upload app-latest FujiRemote.apk --clobber
            gh release edit app-latest --title "$title" --notes "$notes"
          else
            gh release create app-latest FujiRemote.apk --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
