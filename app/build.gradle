plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fujiapp.remote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fujiapp.remote'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.17.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Every build must be signed with the same key, or Android refuses to install it over the
    // previous one. GitHub Actions passes that key in FUJI_KEYSTORE_FILE (from a repository
    // secret); without it, builds fall back to the build machine's own debug key.
    def keystore = System.getenv('FUJI_KEYSTORE_FILE')
    signingConfigs {
        if (keystore) {
            fixed {
                storeFile file(keystore)
                storePassword System.getenv('FUJI_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('FUJI_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('FUJI_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    // Real org.json on the JVM so recipe (de)serialisation is exercised in unit tests.
    testImplementation 'org.json:json:20240303'
}
