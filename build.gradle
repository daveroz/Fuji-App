// Root build file. Plugin versions are declared here and applied in :app.
// Mirrors the known-good toolchain used by the Deco Launcher build:
//   Android Gradle Plugin 8.13.2, Gradle 8.14.3 (see gradle/wrapper), Java 17.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
